name: TopNotchSH
options:
  bundleIdPrefix: com.topnotchsh
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    # The release version. Also the build number, which Sparkle compares.
    MARKETING_VERSION: "0.1.2"
    # Where releases (DMG + appcast.xml) are published.
    GITHUB_REPOSITORY: harvmaster/top-notch.sh
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Apple silicon only.
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: true
    DEAD_CODE_STRIPPING: true
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    minorVersion: "1.20.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: "2.6.0"
schemes:
  TopNotchSH:
    build:
      targets:
        TopNotchSH: all
    test:
      config: Debug
      targets:
        - TopNotchSHTests
    run:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
targets:
  TopNotchSH:
    type: application
    platform: macOS
    sources:
      - path: TopNotchSH
        excludes:
          - Resources/Info.plist
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
      - sdk: Carbon.framework
    info:
      path: TopNotchSH/Resources/Info.plist
      properties:
        CFBundleName: Top NotchSH
        CFBundleDisplayName: Top NotchSH
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleVersion: "$(MARKETING_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        # Sparkle: the update feed is attached to every GitHub release, and only
        # updates signed with the matching private key are accepted.
        SUFeedURL: "https://github.com/$(GITHUB_REPOSITORY)/releases/latest/download/appcast.xml"
        SUPublicEDKey: K6E1Ss9GtXwtZzYQLyRorJIv+QnfjOuR4MWx9rqwMxs=
        NSHumanReadableCopyright: "Copyright © 2026 Harvey Zuccon. Released under the MIT License."
        # Shown in macOS permission prompts when a command run in the terminal
        # needs access; macOS attributes these requests to the terminal app.
        NSAppleEventsUsageDescription: "A command running in Top NotchSH wants to control another app."
        NSCameraUsageDescription: "A command running in Top NotchSH wants to use the camera."
        NSMicrophoneUsageDescription: "A command running in Top NotchSH wants to use the microphone."
        NSDesktopFolderUsageDescription: "A command running in Top NotchSH wants to access your Desktop folder."
        NSDocumentsFolderUsageDescription: "A command running in Top NotchSH wants to access your Documents folder."
        NSDownloadsFolderUsageDescription: "A command running in Top NotchSH wants to access your Downloads folder."
        NSRemovableVolumesUsageDescription: "A command running in Top NotchSH wants to access a removable volume."
        NSNetworkVolumesUsageDescription: "A command running in Top NotchSH wants to access a network volume."
    entitlements:
      path: TopNotchSH/Resources/TopNotchSH.entitlements
      # macOS attributes privacy requests from commands run in the terminal to
      # the terminal app. Under the hardened runtime these are refused unless
      # declared, so osascript, or tools recording audio or video, would fail.
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.topnotchsh.app
        PRODUCT_NAME: Top NotchSH
        PRODUCT_MODULE_NAME: TopNotchSH
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
  TopNotchSHTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TopNotchSHTests
    dependencies:
      - target: TopNotchSH
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.topnotchsh.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Top NotchSH.app/Contents/MacOS/Top NotchSH"
        BUNDLE_LOADER: "$(TEST_HOST)"
